name: Website validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'packages/brand/**'
      - 'scripts/check-boundaries.mjs'
      - 'eslint.config.js'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.prettierrc'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.node-version'
      - '.prettierignore'
      - '.github/workflows/website-validation.yml'

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: bun install --filter '@gitcode/website' --frozen-lockfile
      - run: bun run check:boundaries
      - run: bun run lint:shared
      - run: bun run format:check
      - run: bun run check:website
      - run: bun run build:website
      - uses: actions/upload-artifact@v4
        with:
          name: gitcode-website-static
          path: apps/website/.output/public/
          if-no-files-found: error
