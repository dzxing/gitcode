name: Secret scan

on:
  workflow_dispatch:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted scan policy
        uses: actions/checkout@v7
        with:
          path: policy
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: policy/.node-version
      - name: Scan all reachable history using trusted policy
        run: node policy/scripts/check-secrets.mjs history source policy/.gitleaks.toml
