name: Electron desktop validation (unsigned)

# This workflow validates builds without publishing or signing them.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/brand/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.prettierrc'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.node-version'
      - '.prettierignore'
      - 'scripts/check-boundaries.mjs'
      - 'eslint.config.js'
      - '.github/workflows/desktop-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: bun install --filter 'gitcode-workbench' --frozen-lockfile
      - run: bun run check:boundaries
      - run: bun run lint:shared
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - run: node apps/desktop/scripts/package-desktop.mjs --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: gitcode-electron-unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/desktop/
          if-no-files-found: error
