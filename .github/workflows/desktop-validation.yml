name: Electron desktop validation (unsigned)

# Manual validation only; this workflow does not publish releases or sign apps.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # First install generates electron/bun.lock; commit it after validation.
      - run: bun install --cwd electron
      - run: bun run test
      - run: bun run build
      - run: node scripts/package-desktop.mjs --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: gitcode-electron-unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/
            electron/bun.lock
          if-no-files-found: error
