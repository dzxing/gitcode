[package]
name = "gitk-desktop"
version = "0.1.0"
description = "GitK cross-platform Git workbench"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gitk_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gitk-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3", optional = true , features = [] }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true , features = [] }
